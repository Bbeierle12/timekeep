[project]
id = "your-project-ref"
name = "timekeep"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[auth]
enabled = false  # We use custom auth — not Supabase Auth
site_url = "http://localhost:5173"

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

# Local seed data is loaded from supabase/seed.sql

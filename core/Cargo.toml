[package]
name = "timekeep-core"
version = "0.1.0"
edition = "2021"
description = "Core business logic for the Timekeep compliance platform"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["wasm-bindgen"]
python = ["pyo3"]
ffi = []

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optional: WASM bindings
wasm-bindgen = { version = "0.2", optional = true }

# Optional: Python bindings
pyo3 = { version = "0.24", features = ["extension-module"], optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
